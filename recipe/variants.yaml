# building recent STL requires recent compilers
c_compiler_version:
  - "2026"
cxx_compiler_version:
  - "2026"

hardening:
  - none
  - debug

# publish hardened builds to a separate label
channel_targets:
  - conda-forge main
  - conda-forge msvcstl_debug

zip_keys:
  - [hardening, channel_targets]
